[project]
name = "encyclist"
version = "0.1.0"
description = "Self-hosted, MCP-native shared knowledge base"
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "Matej" }]

dependencies = [
    "mcp>=1.2.0,<2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "starlette>=0.36",
    "chromadb>=0.5.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
web = [
    "jinja2>=3.1",
    "markdown>=3.6",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
