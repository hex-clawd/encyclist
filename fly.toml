app = "encyclist"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  ENCYCLIST_DATA_DIR = "/data"
  CHROMA_HOME = "/data/chroma"
  ENCYCLIST_URL = "http://127.0.0.1:8000/mcp"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 10
    hard_limit = 25

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "get"
  path = "/health"

[mounts]
  source = "encyclist_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
